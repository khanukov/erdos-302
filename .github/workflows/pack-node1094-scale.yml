name: Pack node 1094 bounded capacity batch
on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Zero-based batch number (0 is vertices 3-10)"
        required: true
        default: "0"
        type: string
permissions:
  contents: read
jobs:
  upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: khanukov/erdos302
          ref: a60f43511ce0741ef6e80bdb9b620c5bf854f81c
          path: lower-source
          persist-credentials: false
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.0-rc1/lean-4.33.0-rc1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          printf '%s  %s\n' 25e7b3e18ec75a4e2529fc23194be8e3cc3183df99b553f870d8a111c7488210 "$RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Check generated declarations
        run: python3 -m unittest discover -s tests -p test_pack1094_scale.py
      - name: Prepare project and compile vertex
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C lower-source rev-parse HEAD)" = a60f43511ce0741ef6e80bdb9b620c5bf854f81c
          printf '%s  %s\n' bf79ae9596f6872d3275ee91f8b2dc52b49eb5bdd60b2c8b41782f87dc137f9d lower-source/lower-lean/Erdos302Lower/Defs.lean | sha256sum -c -
          p="$RUNNER_TEMP/pack-project"
          mkdir -p "$p/Erdos302Lower"
          cp audit/mathlib-bridge-ci/project/* "$p/"
          cp lower-source/lower-lean/Erdos302Lower/Defs.lean "$p/Erdos302Lower/"
          cp lean/{UpperBridge,UpperBank,Extended,Weighted,Scaling,PackRule,Pack1094,PackShard,Pack1094Shard,PackShardTests}.lean "$p/"
          cd "$p"
          mkdir -p .lake/packages/mathlib
          git -C .lake/packages/mathlib init
          git -C .lake/packages/mathlib remote add origin https://github.com/teorth/mathlib4.git
          git -C .lake/packages/mathlib fetch --no-tags --depth=1 origin da1f94df976c7cd38117281c57d6ee3046c8d104
          git -C .lake/packages/mathlib checkout --detach FETCH_HEAD
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = da1f94df976c7cd38117281c57d6ee3046c8d104
          lake exe cache get || echo 'Mathlib cache unavailable; building from source may time out'
          lake build Erdos302Lower.Defs
          export LEAN_PATH="$(lake env printenv LEAN_PATH):$p"
          for f in UpperBridge UpperBank Extended Weighted Scaling PackRule Pack1094; do
            lean -o "$f.olean" "$f.lean" 2>&1 | tee "$RUNNER_TEMP/$f.log"
          done
          mkdir -p "$GITHUB_WORKSPACE/upstream-olean"
          cp UpperBridge.olean UpperBank.olean Extended.olean Weighted.olean Scaling.olean PackRule.olean Pack1094.olean "$GITHUB_WORKSPACE/upstream-olean/"
      - name: Save reusable compiled upstream modules
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node1094-upstream-olean
          path: upstream-olean/*.olean
          if-no-files-found: error
  shard:
    needs: upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: khanukov/erdos302
          ref: a60f43511ce0741ef6e80bdb9b620c5bf854f81c
          path: lower-source
          persist-credentials: false
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.0-rc1/lean-4.33.0-rc1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          printf '%s  %s\n' 25e7b3e18ec75a4e2529fc23194be8e3cc3183df99b553f870d8a111c7488210 "$RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Prepare matching dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C lower-source rev-parse HEAD)" = a60f43511ce0741ef6e80bdb9b620c5bf854f81c
          printf '%s  %s\n' bf79ae9596f6872d3275ee91f8b2dc52b49eb5bdd60b2c8b41782f87dc137f9d lower-source/lower-lean/Erdos302Lower/Defs.lean | sha256sum -c -
          p="$RUNNER_TEMP/pack-project"
          mkdir -p "$p/Erdos302Lower"
          cp audit/mathlib-bridge-ci/project/* "$p/"
          cp lower-source/lower-lean/Erdos302Lower/Defs.lean "$p/Erdos302Lower/"
          cp lean/{UpperBridge,UpperBank,Extended,Weighted,Scaling,PackRule,Pack1094,PackShard,Pack1094Shard,PackShardTests}.lean "$p/"
          cd "$p"
          mkdir -p .lake/packages/mathlib
          git -C .lake/packages/mathlib init
          git -C .lake/packages/mathlib remote add origin https://github.com/teorth/mathlib4.git
          git -C .lake/packages/mathlib fetch --no-tags --depth=1 origin da1f94df976c7cd38117281c57d6ee3046c8d104
          git -C .lake/packages/mathlib checkout --detach FETCH_HEAD
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = da1f94df976c7cd38117281c57d6ee3046c8d104
          lake exe cache get || echo 'Mathlib cache unavailable; building from source may time out'
          lake build Erdos302Lower.Defs
          export LEAN_PATH="$(lake env printenv LEAN_PATH):$p"
      - name: Restore upstream modules from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node1094-upstream-olean
          path: ${{ runner.temp }}/pack-project
      - name: Generate and compile bounded proof shard
        shell: bash
        env:
          BATCH: ${{ inputs.batch }}
        run: |
          set -euo pipefail
          [[ "$BATCH" =~ ^(0|[1-9][0-9]?)$ ]] || { echo 'invalid batch number'; exit 1; }
          p="$RUNNER_TEMP/pack-project"
          python3 scripts/generate_pack1094_scale.py --out "$p/generated"
          line=$(sed -n "$((10#$BATCH + 1))p" "$p/generated/batches.txt")
          [[ -n "$line" ]] || { echo 'batch outside generated range'; exit 1; }
          cd "$p"
          export LEAN_PATH="$(lake env printenv LEAN_PATH):$p"
          for v in $line; do
            cp "generated/Pack1094Vertex${v}.lean" .
            lean -o "Pack1094Vertex${v}.olean" "Pack1094Vertex${v}.lean" 2>&1 | tee "$RUNNER_TEMP/Pack1094Vertex${v}.log"
            python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/Pack1094Vertex${v}.log" "ArchivePack1094.capacity_vertex_${v}"
          done
          printf -v shard 'Pack1094Batch%03d' "$((10#$BATCH))"
          cp "generated/$shard.lean" .
          lean -o "$shard.olean" "$shard.lean" 2>&1 | tee "$RUNNER_TEMP/$shard.log"
          printf -v theorem 'ArchivePack1094.capacity_batch_%03d' "$((10#$BATCH))"
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/$shard.log" "$theorem"
          mkdir -p "$GITHUB_WORKSPACE/proof-olean"
          cp Pack1094Vertex*.olean "$shard.olean" "$GITHUB_WORKSPACE/proof-olean/"
      - name: Save compiled proof shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node1094-proof-batch-${{ inputs.batch }}
          path: proof-olean/*.olean
          if-no-files-found: error
