name: Node 1190 minimal closure candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assembly:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: khanukov/erdos302
          ref: a60f43511ce0741ef6e80bdb9b620c5bf854f81c
          path: lower-source
          persist-credentials: false
      - name: Verify source inventories and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s independent_bank -p test_node1190_min.py
          python3 -B -O -m unittest discover -s independent_bank -p test_node1190_min.py
          python3 -B independent_bank/node1190_min.py --check
          python3 -B -O independent_bank/node1190_min.py --check
          python3 -B independent_bank/node1209_scope.py --check
          python3 -B -m unittest discover -s independent_bank -p test_node1190_final_split.py
          python3 -B -O -m unittest discover -s independent_bank -p test_node1190_final_split.py
          python3 -B independent_bank/node1190_final_split.py --check
          python3 -B -O independent_bank/node1190_final_split.py --check
          if grep -nE "\b(sorry|admit|native_decide)\b" audit/node1190-min/*.lean; then exit 1; fi
          python3 -B audit/actual-sparse64/closure.py "$RUNNER_TEMP/source"
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.0-rc1/lean-4.33.0-rc1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          printf '%s  %s\n' 25e7b3e18ec75a4e2529fc23194be8e3cc3183df99b553f870d8a111c7488210 "$RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Compile closure, conditional direct bound, and exact type contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C lower-source rev-parse HEAD)" = a60f43511ce0741ef6e80bdb9b620c5bf854f81c
          printf '%s  %s\n' bf79ae9596f6872d3275ee91f8b2dc52b49eb5bdd60b2c8b41782f87dc137f9d lower-source/lower-lean/Erdos302Lower/Defs.lean | sha256sum -c -
          p="$RUNNER_TEMP/project"
          mkdir -p "$p/Erdos302Lower" "$RUNNER_TEMP/logs"
          cp audit/mathlib-bridge-ci/project/* "$p/"
          cp lower-source/lower-lean/Erdos302Lower/Defs.lean "$p/Erdos302Lower/"
          cp -R "$RUNNER_TEMP/source/." "$p/"
          cp audit/actual-sparse64/Contract.lean "$p/Contract.lean"
          cp lean/{MixedDag,CaseRules,CaseDual,CaseTree,MixedCaseTrimCandidate,Node1209SourceCandidate}.lean "$p/"
          cp audit/node1190-min/*.lean "$p/"
          cp audit/node1190-final-split/*.lean "$p/"
          cp audit/node1190-fold/Node1190ComponentFold.lean "$p/"
          cd "$p"
          mkdir -p .lake/packages/mathlib
          git -C .lake/packages/mathlib init
          git -C .lake/packages/mathlib remote add origin https://github.com/teorth/mathlib4.git
          git -C .lake/packages/mathlib fetch --no-tags --depth=1 origin da1f94df976c7cd38117281c57d6ee3046c8d104
          git -C .lake/packages/mathlib checkout --detach FETCH_HEAD
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = da1f94df976c7cd38117281c57d6ee3046c8d104
          lake exe cache get
          lake build Erdos302Lower.Defs
          export LEAN_PATH="$(lake env printenv LEAN_PATH):$p" LEAN_NUM_THREADS=1 LEAN_STACK_SIZE_KB=262144
          ulimit -v 25165824
          python3 "$GITHUB_WORKSPACE/audit/actual-sparse64/build.py" "$p" "$RUNNER_TEMP/logs"
          for f in MixedDag CaseRules CaseDual CaseTree MixedCaseTrimCandidate Node1209SourceCandidate; do
            f="${f%.lean}"
            timeout --kill-after=30s 45m lean -o "$f.olean" "$f.lean" 2>&1 | tee "$RUNNER_TEMP/logs/$f.log"
          done
          timeout --kill-after=30s 45m lean -o DenseData.olean DenseData.lean 2>&1 | tee "$RUNNER_TEMP/logs/DenseData.log"
          # Rebuild all singleton inputs against the same DenseData and prerequisite objects.
          for f in Node1190DualData Node1190LeafBridge Node1190ComponentFold; do
            echo "BUILD $f"
            timeout --kill-after=30s 45m lean -o "$f.olean" "$f.lean" 2>&1 | tee "$RUNNER_TEMP/logs/$f.log"
          done
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/logs/Node1190LeafBridge.log" Node1190Dual.leaf_from_components
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/logs/Node1190ComponentFold.log" Node1190ComponentFold.list_all_of_positions Node1190ComponentFold.mapped_getD_mem Node1190ComponentFold.finset_all_of_list Node1190ComponentFold.leaf_from_positions
          for src in Node1190Refs*.lean Node1190Capacity*.lean Node1190Objective.lean Node1190Assembly.lean; do
            f="${src%.lean}"
            echo "BUILD $f"
            timeout --kill-after=30s 45m lean -o "$f.olean" "$src" 2>&1 | tee "$RUNNER_TEMP/logs/$f.log"
            python3 "$GITHUB_WORKSPACE/independent_bank/node1190_axiom_inventory.py" "$src" "$RUNNER_TEMP/logs/$f.log"
          done
          for src in Shard*.lean; do
            f="${src%.lean}"
            echo "BUILD $f"
            timeout --kill-after=30s 45m lean -o "$f.olean" "$src" 2>&1 | tee "$RUNNER_TEMP/logs/$f.log"
            python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/logs/$f.log" "Node1190Min.$f"
          done
          for f in Candidate ExactContract; do
            echo "BUILD $f"
            timeout --kill-after=30s 45m lean -o "$f.olean" "$f.lean" 2>&1 | tee "$RUNNER_TEMP/logs/$f.log"
          done
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/logs/Candidate.log" Node1190Min.valid Node1190Min.source_subset Node1190Min.source_bound
      - name: Retain compilation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node1190-min-logs
          path: |
            ${{ runner.temp }}/logs
            ${{ runner.temp }}/Small*.log
            ${{ runner.temp }}/Dense*.log
          if-no-files-found: warn
