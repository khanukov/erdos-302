name: Joint six literal candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: '1'
      LEAN_STACK_SIZE_KB: '262144'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inventory, negative tests and finite corroboration
        run: |
          set -euo pipefail
          for opt in '' '-O'; do
            python3 -B $opt tests/test_upper_project.py
            python3 -B $opt audit/joint-independence-ci/test_inventory.py
            python3 -B $opt audit/joint-independence-ci/test_workflow.py
            python3 -B $opt audit/joint-independence-ci/check_inventory.py "$GITHUB_WORKSPACE"
            python3 -B $opt audit/test_joint_independence_candidate.py
            python3 -B $opt audit/test_joint_six_candidate.py
            python3 -B $opt audit/test_joint_six_computable.py
            python3 -B $opt audit/test_six_shards.py
            python3 -B $opt audit/joint_concrete_check.py
            python3 -B $opt audit/mathlib-bridge-ci/test_check_axioms.py
          done
          python3 -B audit/multiplicity-ci/check_inventory.py "$GITHUB_WORKSPACE"
          if grep -nE '\b(sorry|admit|native_decide)\b' lean/JointSixCandidate.lean; then exit 1; fi
      - name: Prepare isolated Lake project
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/joint-project"
          mkdir -p "$p/audit/ledger-candidate"
          cp lakefile.toml lake-manifest.json lean-toolchain "$p/"
          cp -a lean "$p/lean"
          cp -a audit/ledger-candidate/lean "$p/audit/ledger-candidate/lean"
          printf '\n[[lean_lib]]\nname = "JointSixPilot"\nsrcDir = "lean"\nroots = ["JointSixCandidate", "JointIndependenceCandidate", "JointIndependenceCandidateTests", "LiteralFactorMatchingCandidate", "FactorCountCandidate", "SuffixBijectionCandidate"]\n' >> "$p/lakefile.toml"
          echo "PILOT_PROJECT=$p" >> "$GITHUB_ENV"
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.0-rc1/lean-4.33.0-rc1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          printf '%s  %s\n' 25e7b3e18ec75a4e2529fc23194be8e3cc3183df99b553f870d8a111c7488210 "$RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib and cache
        run: |
          set -euo pipefail
          cd "$PILOT_PROJECT"
          mkdir -p .lake/packages/mathlib
          git -C .lake/packages/mathlib init
          git -C .lake/packages/mathlib remote add origin https://github.com/teorth/mathlib4.git
          git -C .lake/packages/mathlib fetch --no-tags --depth=1 origin da1f94df976c7cd38117281c57d6ee3046c8d104
          git -C .lake/packages/mathlib checkout --detach FETCH_HEAD
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = da1f94df976c7cd38117281c57d6ee3046c8d104
          timeout 30m lake exe cache get
      - name: Build target, compile Lean regressions and gate all candidate axioms
        run: |
          set -euo pipefail
          cd "$PILOT_PROJECT"
          ulimit -v 24000000
          timeout 120m lake build +JointSixCandidate 2>&1 | tee "$RUNNER_TEMP/build.log"
          timeout 30m lake env lean lean/JointIndependenceCandidateTests.lean 2>&1 | tee "$RUNNER_TEMP/lean-tests.log"
          timeout 30m lake env lean lean/JointSixComputableTests.lean 2>&1 | tee "$RUNNER_TEMP/computable-tests.log"
          timeout 30m lake env lean lean/JointSixCandidate.lean 2>&1 | tee "$RUNNER_TEMP/axioms.log"
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/axioms.log" JointSixCandidate.literal_weight JointSixCandidate.edge_in_vertices JointSixCandidate.concrete_edge JointSixCandidate.independent_bound JointSixCandidate.joint_six
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: joint-six-logs
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/lean-tests.log
            ${{ runner.temp }}/computable-tests.log
            ${{ runner.temp }}/axioms.log
          if-no-files-found: warn
