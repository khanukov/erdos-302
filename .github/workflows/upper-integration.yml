name: Upper integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "1"
      LEAN_STACK_SIZE_KB: "262144"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Structural tests
        run: |
          python3 tests/test_upper_project.py
          python3 -O tests/test_upper_project.py
          python3 -B -m unittest discover -s independent_bank -p test_replay_inventory.py
          python3 -B -O -m unittest discover -s independent_bank -p test_replay_inventory.py
          python3 -B -m unittest discover -s independent_bank -p test_archive_seed.py
          python3 -B -O -m unittest discover -s independent_bank -p test_archive_seed.py
          python3 -B independent_bank/archive_seed.py
          python3 -B -m unittest discover -s independent_bank -p test_archive_prefix.py
          python3 -B -O -m unittest discover -s independent_bank -p test_archive_prefix.py
          python3 -B independent_bank/archive_prefix.py
          python3 -B -m unittest discover -s independent_bank -p test_case4_staged.py -v
          python3 -B -O -m unittest discover -s independent_bank -p test_case4_staged.py -v
          python3 -B independent_bank/case4_staged.py
          python3 -B -m unittest discover -s independent_bank -p test_trim5.py -v
          python3 -B -O -m unittest discover -s independent_bank -p test_trim5.py -v
          python3 -B independent_bank/trim5.py
          python3 -B -m unittest discover -s audit/ledger-candidate/tests -v
          python3 -B -O -m unittest discover -s audit/ledger-candidate/tests -v
          if grep -nE '\b(sorry|admit|native_decide)\b' audit/ledger-candidate/lean/*.lean; then exit 1; fi
          python3 audit/mathlib-bridge-ci/test_check_axioms.py
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.0-rc1/lean-4.33.0-rc1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          printf '%s  %s\n' 25e7b3e18ec75a4e2529fc23194be8e3cc3183df99b553f870d8a111c7488210 "$RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Fetch exact mathlib and build integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/packages/mathlib
          git -C .lake/packages/mathlib init
          git -C .lake/packages/mathlib remote add origin https://github.com/teorth/mathlib4.git
          git -C .lake/packages/mathlib fetch --no-tags --depth=1 origin da1f94df976c7cd38117281c57d6ee3046c8d104
          git -C .lake/packages/mathlib checkout --detach FETCH_HEAD
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = da1f94df976c7cd38117281c57d6ee3046c8d104
          lake exe cache get
          lake build UpperIntegration
          lake env lean lean/UpperIntegration.lean 2>&1 | tee "$RUNNER_TEMP/upper-axioms.log"
          python3 audit/mathlib-bridge-ci/check_axioms.py "$RUNNER_TEMP/upper-axioms.log" UpperBridge.finite_card_bound ArchiveSumBridge.boundaryOK_of_pos ArchiveSumBridge.global_upper_archive SmoothPartition.global_from_prefix_demands PrimePowerReindex.bounded_decomposition PrimePowerSum.sum_reindex PrimePowerRenewal.sum_unroll PrimePowerRenewal.sum_update BankProfile.checked_node_seed BankProfileConcrete.full_prefix ArchiveSmallPrefix.valid ArchiveSmallPrefix.sound ArchiveCase4Staged.image0 ArchiveCase4Staged.image1 ArchiveCase4Staged.image2 ArchiveCase4Staged.bound4 ArchiveCase4Staged.sound ArchiveTrim5.all_edges_retained ArchiveTrim5.witnesses_valid ArchiveTrim5.every_retained_has_witness ArchiveTrim5.isolated_trim ArchiveTrim5.image3_bound ArchiveTrim5.bound5 ArchiveTrim5.sound PrefixArchiveBridge.cells_le_prefix PrefixArchiveBridge.upper_from_prefix GainFold.fold_gain_occurrences GainFold.fold_gain_fin GainFold.fold_project GainPrefix.occurrences_eq_prefix_entries GainPrefix.fold_eq_prefix_entries ArchiveGainPrefix.distribute ArchiveGainPrefix.step_project ArchiveGainPrefix.project_fold ArchiveGainPrefix.gain_eq_prefix ArchiveLedger.archive_check ArchiveLedger.archive_valid ArchiveLedger.archive_arithmetic ArchiveLedgerSumBridge.ledger_gain_complement ArchiveLedgerSumBridge.ledger_error_real ArchiveLedgerSumBridge.conditional_literal_endpoint ArchiveLedgerSumBridge.conditional_indexed_endpoint
