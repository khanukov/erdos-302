name: Extension candidate diagnostic
on:
  workflow_dispatch:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: khanukov/erdos302
          ref: a60f43511ce0741ef6e80bdb9b620c5bf854f81c
          path: lower-source
          persist-credentials: false
      - name: Validate inventories
        run: |
          set -euo pipefail
          python3 -B tests/test_upper_project.py
          python3 -B audit/multiplicity-ci/check_inventory.py .
          python3 -B audit/mathlib-bridge-ci/test_check_axioms.py
          python3 -B -m unittest discover -s audit/extension-ci -p 'test_*.py'
          python3 -B -O -m unittest discover -s audit/extension-ci -p 'test_*.py'
          python3 -B audit/extension-ci/first_archive.py --check-shards
          python3 -B audit/extension-ci/closure.py "$RUNNER_TEMP/extension-source"
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.0-rc1/lean-4.33.0-rc1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          printf '%s  %s\n' 25e7b3e18ec75a4e2529fc23194be8e3cc3183df99b553f870d8a111c7488210 "$RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Build isolated closure and gate declarations
        run: |
          set -euo pipefail
          test "$(git -C lower-source rev-parse HEAD)" = a60f43511ce0741ef6e80bdb9b620c5bf854f81c
          printf '%s  %s\n' bf79ae9596f6872d3275ee91f8b2dc52b49eb5bdd60b2c8b41782f87dc137f9d lower-source/lower-lean/Erdos302Lower/Defs.lean | sha256sum -c -
          p="$RUNNER_TEMP/extension-project"
          mkdir -p "$p/Erdos302Lower"
          cp audit/mathlib-bridge-ci/project/* "$p/"
          cp lower-source/lower-lean/Erdos302Lower/Defs.lean "$p/Erdos302Lower/"
          cp "$RUNNER_TEMP/extension-source/"*.lean "$p/"
          cd "$p"
          mkdir -p .lake/packages/mathlib
          git -C .lake/packages/mathlib init
          git -C .lake/packages/mathlib remote add origin https://github.com/teorth/mathlib4.git
          git -C .lake/packages/mathlib fetch --no-tags --depth=1 origin da1f94df976c7cd38117281c57d6ee3046c8d104
          git -C .lake/packages/mathlib checkout --detach FETCH_HEAD
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = da1f94df976c7cd38117281c57d6ee3046c8d104
          lake exe cache get || echo 'Mathlib cache unavailable; build may time out'
          lake build Erdos302Lower.Defs
          export LEAN_PATH="$(lake env printenv LEAN_PATH):$p"
          for f in UpperBridge UpperBank Extended Weighted Scaling PackRule Dag UpperRenewal Projection BankProfile ExtensionSeedCandidate ExtensionBoundaryData; do
            lean -o "$f.olean" "$f.lean" 2>&1 | tee "$RUNNER_TEMP/$f.log"
          done
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/ExtensionSeedCandidate.log" ExtensionSeedCandidate.seed ExtensionSeedCandidate.scaled_seed ExtensionSeedCandidate.pair_boundary_sound ExtensionSeedCandidate.positive_example
          # 20 x 15 minutes consumes up to 300 minutes; setup, axiom
          # checks and assembly also share the 350-minute job deadline.
          # A deadline is a diagnostic failure, never a successful shard.
          for i in $(seq -w 0 19); do
            f="ExtensionBoundaryShard$i"
            printf 'START %s %s deadline=15m\n' "$f" "$(date -u +%FT%TZ)"
            set +e
            /usr/bin/time -v timeout --kill-after=10s 15m lean -o "$f.olean" "$f.lean" 2>&1 | tee "$RUNNER_TEMP/$f.log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            printf 'END %s %s command_status=%s tee_status=%s\n' "$f" "$(date -u +%FT%TZ)" "${statuses[0]}" "${statuses[1]}"
            test "${statuses[0]}" -eq 0 && test "${statuses[1]}" -eq 0 || exit 1
            python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/$f.log" "ExtensionFirstArchive.shard$i"
          done
          lean -o ExtensionBoundaryAssembly.olean ExtensionBoundaryAssembly.lean 2>&1 | tee "$RUNNER_TEMP/ExtensionBoundaryAssembly.log"
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/ExtensionBoundaryAssembly.log" ExtensionFirstArchive.source_lt ExtensionFirstArchive.checked_pair_boundary ExtensionFirstArchive.checked_boundary ExtensionFirstArchive.source_to_seed ExtensionFirstArchive.projected_seed
