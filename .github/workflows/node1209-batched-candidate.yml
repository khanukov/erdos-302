name: Node 1209 batched same-run capacity candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: khanukov/erdos302
          ref: a60f43511ce0741ef6e80bdb9b620c5bf854f81c
          path: lower-source
          persist-credentials: false
      - name: Check authenticated transcription and mutations
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m unittest discover -s audit -p test_node1209_parallel.py
          python3 -B -O -m unittest discover -s audit -p test_node1209_parallel.py
          python3 -B independent_bank/node1209_pack_preflight.py
          python3 -B independent_bank/node1209_pack_all.py --check
          python3 -B -O independent_bank/node1209_pack_all.py --check
          python3 -B -m unittest discover -s independent_bank -p test_node1209_pack_all.py
          python3 -B -O -m unittest discover -s independent_bank -p test_node1209_pack_all.py
          python3 -B independent_bank/node1209_pack_pilot.py --check
          python3 -B -O independent_bank/node1209_pack_pilot.py --check
          python3 -B -m unittest discover -s independent_bank -p test_node1209_pack_pilot.py
          python3 -B -O -m unittest discover -s independent_bank -p test_node1209_pack_pilot.py
          python3 -B audit/multiplicity-ci/check_inventory.py .
          python3 -B audit/joint-independence-ci/check_inventory.py .
          python3 -B -c 'from pathlib import Path; p=Path("lean/node1209-bridge"); actual={x.name for x in p.glob("*.lean")}; expected={"Node1209CapacityBridge.lean", "Node1209BridgeTests.lean"}; assert actual == expected, (actual, expected)'
          if grep -nE '\b(sorry|admit|native_decide)\b' lean/node1209-pack-all/*.lean; then exit 1; fi
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.0-rc1/lean-4.33.0-rc1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          printf '%s  %s\n' 25e7b3e18ec75a4e2529fc23194be8e3cc3183df99b553f870d8a111c7488210 "$RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Compile and gate each occurrence and bound
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C lower-source rev-parse HEAD)" = a60f43511ce0741ef6e80bdb9b620c5bf854f81c
          printf '%s  %s\n' bf79ae9596f6872d3275ee91f8b2dc52b49eb5bdd60b2c8b41782f87dc137f9d lower-source/lower-lean/Erdos302Lower/Defs.lean | sha256sum -c -
          p="$(mktemp -d "$RUNNER_TEMP/node1209-batched.XXXXXXXX")"
          mkdir -p "$p/Erdos302Lower"
          cp audit/mathlib-bridge-ci/project/* "$p/"
          cp lower-source/lower-lean/Erdos302Lower/Defs.lean "$p/Erdos302Lower/"
          cp lean/{UpperBridge,UpperBank,Extended,Weighted,Scaling,PackRule,Dag,MixedDag,Node1209PackPilot}.lean "$p/"
          cd "$p"
          mkdir -p .lake/packages/mathlib
          git -C .lake/packages/mathlib init
          git -C .lake/packages/mathlib remote add origin https://github.com/teorth/mathlib4.git
          git -C .lake/packages/mathlib fetch --no-tags --depth=1 origin da1f94df976c7cd38117281c57d6ee3046c8d104
          git -C .lake/packages/mathlib checkout --detach FETCH_HEAD
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = da1f94df976c7cd38117281c57d6ee3046c8d104
          lake exe cache get
          lake build Erdos302Lower.Defs
          export LEAN_PATH="$(lake env printenv LEAN_PATH):$p"
          for f in UpperBridge UpperBank Extended Weighted Scaling PackRule Dag MixedDag; do
            lean -o "$f.olean" "$f.lean" 2>&1 | tee "$RUNNER_TEMP/$f.log"
          done
          bash "$GITHUB_WORKSPACE/audit/node1209-capacity-parallel-gate.sh"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: node1209-capacity-logs
          path: ${{ runner.temp }}/node1209-capacity-logs/
          if-no-files-found: warn
