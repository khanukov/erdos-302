name: First real seed candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: "1"
      LEAN_STACK_SIZE_KB: "262144"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Source and negative tests
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s audit/first-seed-ci -p test_closure.py -v
          python3 -B -O -m unittest discover -s audit/first-seed-ci -p test_closure.py -v
          python3 -B tests/test_upper_project.py
          python3 -B audit/multiplicity-ci/check_inventory.py "$PWD"
          python3 -B audit/joint-independence-ci/check_inventory.py "$PWD"
          python3 -B audit/mathlib-bridge-ci/test_check_axioms.py
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.0-rc1/lean-4.33.0-rc1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          printf '%s  %s\n' 25e7b3e18ec75a4e2529fc23194be8e3cc3183df99b553f870d8a111c7488210 "$RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Compile exact closure and gate axioms
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/first-seed-project"
          mkdir -p "$p/.lake/packages/mathlib"
          cp audit/renewal-joint-ci/project/* "$p/"
          python3 -B audit/first-seed-ci/closure.py "$p"
          if grep -nRE '\b(sorry|admit|native_decide)\b' "$p" --include='*.lean'; then exit 1; fi
          git -C "$p/.lake/packages/mathlib" init
          git -C "$p/.lake/packages/mathlib" remote add origin https://github.com/teorth/mathlib4.git
          git -C "$p/.lake/packages/mathlib" fetch --no-tags --depth=1 origin da1f94df976c7cd38117281c57d6ee3046c8d104
          git -C "$p/.lake/packages/mathlib" checkout --detach FETCH_HEAD
          test "$(git -C "$p/.lake/packages/mathlib" rev-parse HEAD)" = da1f94df976c7cd38117281c57d6ee3046c8d104
          python3 -B -c 'import sys; sys.path.insert(0,"audit/first-seed-ci"); import closure; print("\n".join(closure.ORDER))' > "$RUNNER_TEMP/order"
          cd "$p"
          lake exe cache get
          export LEAN_PATH="$(lake env printenv LEAN_PATH):$p"
          while IFS= read -r module; do
            f="${module//./\/}"
            echo "Compiling $module"
            lean -o "$f.olean" "$f.lean" 2>&1 | tee "$RUNNER_TEMP/$module.log"
          done < "$RUNNER_TEMP/order"
          gate="$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py"
          python3 "$gate" "$RUNNER_TEMP/ArchiveSmallPrefix.log" ArchiveSmallPrefix.valid ArchiveSmallPrefix.sound
          python3 "$gate" "$RUNNER_TEMP/ArchiveFirstSeedCandidate.log" ArchiveFirstSeedCandidate.ordered_to_demand ArchiveFirstSeedCandidate.seed_demand
          python3 "$gate" "$RUNNER_TEMP/ArchiveFirstSeedContract.log" ArchiveFirstSeedCandidate.ordered_to_demand ArchiveFirstSeedCandidate.seed_demand
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: first-seed-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: warn
