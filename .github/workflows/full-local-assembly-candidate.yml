name: Candidate local snapshot assembly and bounded first shard
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: khanukov/erdos302
          ref: a60f43511ce0741ef6e80bdb9b620c5bf854f81c
          path: lower-source
          persist-credentials: false
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.0-rc1/lean-4.33.0-rc1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          printf '%s  %s\n' 25e7b3e18ec75a4e2529fc23194be8e3cc3183df99b553f870d8a111c7488210 "$RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Prepare project and compile prototype
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C lower-source rev-parse HEAD)" = a60f43511ce0741ef6e80bdb9b620c5bf854f81c
          printf '%s  %s\n' bf79ae9596f6872d3275ee91f8b2dc52b49eb5bdd60b2c8b41782f87dc137f9d lower-source/lower-lean/Erdos302Lower/Defs.lean | sha256sum -c -
          p="$RUNNER_TEMP/pack-project"
          mkdir -p "$p/Erdos302Lower"
          cp audit/mathlib-bridge-ci/project/* "$p/"
          cp lower-source/lower-lean/Erdos302Lower/Defs.lean "$p/Erdos302Lower/"
          cp lean/{UpperBridge,UpperBank,Extended,Weighted,Scaling,PackRule,Dag,MixedDag,CaseRules,CaseDual,CaseTree,MixedCaseTrimCandidate,MixedCaseTrimCandidateTest,MixedDagLocality,MixedDagLocalityTests,FullLocalAssemblyCandidate,FullLocalFirstShardTest}.lean "$p/"
          cd "$p"
          mkdir -p .lake/packages/mathlib
          git -C .lake/packages/mathlib init
          git -C .lake/packages/mathlib remote add origin https://github.com/teorth/mathlib4.git
          git -C .lake/packages/mathlib fetch --no-tags --depth=1 origin da1f94df976c7cd38117281c57d6ee3046c8d104
          git -C .lake/packages/mathlib checkout --detach FETCH_HEAD
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = da1f94df976c7cd38117281c57d6ee3046c8d104
          lake exe cache get
          lake build Erdos302Lower.Defs
          export LEAN_PATH="$(lake env printenv LEAN_PATH):$p"
          for f in UpperBridge UpperBank Extended Weighted Scaling PackRule Dag MixedDag CaseRules CaseDual CaseTree MixedCaseTrimCandidate MixedCaseTrimCandidateTest MixedDagLocality MixedDagLocalityTests FullLocalAssemblyCandidate; do
            echo "Checking $f"
            lean -o "$f.olean" "$f.lean" 2>&1 | tee "$RUNNER_TEMP/$f.log"
          done
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/MixedCaseTrimCandidate.log" MixedCaseTrimCandidate.image_bound MixedCaseTrimCandidate.case_sound MixedCaseTrimCandidate.trim_sound MixedCaseTrimCandidate.extra_sound
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/MixedCaseTrimCandidateTest.log" MixedCaseTrimCandidateTest.mixed_valid MixedCaseTrimCandidateTest.mixed_bound MixedCaseTrimCandidateTest.mixed_trim_valid MixedCaseTrimCandidateTest.mixed_trim_bound MixedCaseTrimCandidateTest.outside_valid MixedCaseTrimCandidateTest.outside_bound MixedCaseTrimCandidateTest.negative_row MixedCaseTrimCandidateTest.negative_dual_rejected
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/MixedDagLocality.log" MixedDagLocality.CaseTrim.extra_sound MixedDagLocality.caseTrim_sound_one MixedDagLocality.check_local MixedDagLocality.sound_one
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/MixedDagLocalityTests.log" MixedDagLocality.CaseTrim.extra_sound MixedDagLocality.caseTrim_sound_one

          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/FullLocalAssemblyCandidate.log" FullLocalAssemblyCandidate.assemble
          cd "$GITHUB_WORKSPACE"
          python3 -m unittest discover -s independent_bank -p test_full_local_shards.py -v
          python3 independent_bank/full_local_shards.py "$RUNNER_TEMP/local-shards" --target-bytes 262144
          python3 independent_bank/full_local_shards.py "$RUNNER_TEMP/local-shards" --target-bytes 262144 --verify-existing
          python3 -m unittest discover -s independent_bank -p test_first_local_correspondence.py -v
          python3 independent_bank/first_local_correspondence.py "$RUNNER_TEMP/local-shards/FullLocal0000.lean"
          cp "$RUNNER_TEMP/local-shards/FullLocalCommon.lean" "$RUNNER_TEMP/local-shards/FullLocal0000.lean" "$p/"
          cp audit/shard-aggregation/{FirstRealData,FirstRealShard}.lean "$p/"
          cp lean/FullLocalFirstNineTransfer.lean "$p/"
          cd "$p"
          # Per-process virtual-address cap, not an aggregate job-memory cap.
          ulimit -v 25165824
          export LEAN_STACK_SIZE_KB=262144
          for f in FullLocalCommon FullLocal0000 FullLocalFirstShardTest FirstRealData FirstRealShard FullLocalFirstNineTransfer; do
            timeout 900 lean -o "$f.olean" "$f.lean" 2>&1 | tee "$RUNNER_TEMP/$f.log"
          done
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/FirstRealShard.log" FirstRealShard.check0 FirstRealShard.check1 FirstRealShard.check2 FirstRealShard.check3 FirstRealShard.check4 FirstRealShard.check5 FirstRealShard.check6 FirstRealShard.check7 FirstRealShard.check8 FirstRealShard.checked FirstRealShard.bound8
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/FullLocalFirstShardTest.log" FullLocalFirstShardTest.node0_valid FullLocalFirstShardTest.node0_bound
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/FullLocalFirstNineTransfer.log" FullLocalFirstNineTransfer.fields FullLocalFirstNineTransfer.rules FullLocalFirstNineTransfer.reads_bounded FullLocalFirstNineTransfer.lower_checked FullLocalFirstNineTransfer.local_checked FullLocalFirstNineTransfer.changed_dependency_rejected FullLocalFirstNineTransfer.changed_dependency_is_read FullLocalFirstNineTransfer.changed_check_false

  resource_diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: khanukov/erdos302
          ref: a60f43511ce0741ef6e80bdb9b620c5bf854f81c
          path: lower-source
          persist-credentials: false
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.0-rc1/lean-4.33.0-rc1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          printf '%s  %s\n' 25e7b3e18ec75a4e2529fc23194be8e3cc3183df99b553f870d8a111c7488210 "$RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Prepare project and compile prototype
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C lower-source rev-parse HEAD)" = a60f43511ce0741ef6e80bdb9b620c5bf854f81c
          printf '%s  %s\n' bf79ae9596f6872d3275ee91f8b2dc52b49eb5bdd60b2c8b41782f87dc137f9d lower-source/lower-lean/Erdos302Lower/Defs.lean | sha256sum -c -
          p="$RUNNER_TEMP/pack-project"
          mkdir -p "$p/Erdos302Lower"
          cp audit/mathlib-bridge-ci/project/* "$p/"
          cp lower-source/lower-lean/Erdos302Lower/Defs.lean "$p/Erdos302Lower/"
          cp lean/{UpperBridge,UpperBank,Extended,Weighted,Scaling,PackRule,Dag,MixedDag,CaseRules,CaseDual,CaseTree,MixedCaseTrimCandidate,MixedCaseTrimCandidateTest,MixedDagLocality,MixedDagLocalityTests,FullLocalAssemblyCandidate,FullLocalFirstShardTest}.lean "$p/"
          cd "$p"
          mkdir -p .lake/packages/mathlib
          git -C .lake/packages/mathlib init
          git -C .lake/packages/mathlib remote add origin https://github.com/teorth/mathlib4.git
          git -C .lake/packages/mathlib fetch --no-tags --depth=1 origin da1f94df976c7cd38117281c57d6ee3046c8d104
          git -C .lake/packages/mathlib checkout --detach FETCH_HEAD
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = da1f94df976c7cd38117281c57d6ee3046c8d104
          lake exe cache get
          lake build Erdos302Lower.Defs
          export LEAN_PATH="$(lake env printenv LEAN_PATH):$p"
          for f in UpperBridge UpperBank Extended Weighted Scaling PackRule Dag MixedDag CaseRules CaseDual CaseTree MixedCaseTrimCandidate MixedCaseTrimCandidateTest MixedDagLocality MixedDagLocalityTests FullLocalAssemblyCandidate; do
            echo "Checking $f"
            lean -o "$f.olean" "$f.lean" 2>&1 | tee "$RUNNER_TEMP/$f.log"
          done
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/MixedCaseTrimCandidate.log" MixedCaseTrimCandidate.image_bound MixedCaseTrimCandidate.case_sound MixedCaseTrimCandidate.trim_sound MixedCaseTrimCandidate.extra_sound
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/MixedCaseTrimCandidateTest.log" MixedCaseTrimCandidateTest.mixed_valid MixedCaseTrimCandidateTest.mixed_bound MixedCaseTrimCandidateTest.mixed_trim_valid MixedCaseTrimCandidateTest.mixed_trim_bound MixedCaseTrimCandidateTest.outside_valid MixedCaseTrimCandidateTest.outside_bound MixedCaseTrimCandidateTest.negative_row MixedCaseTrimCandidateTest.negative_dual_rejected
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/MixedDagLocality.log" MixedDagLocality.CaseTrim.extra_sound MixedDagLocality.caseTrim_sound_one MixedDagLocality.check_local MixedDagLocality.sound_one
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/MixedDagLocalityTests.log" MixedDagLocality.CaseTrim.extra_sound MixedDagLocality.caseTrim_sound_one

          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/FullLocalAssemblyCandidate.log" FullLocalAssemblyCandidate.assemble
          cd "$GITHUB_WORKSPACE"
          python3 -m unittest discover -s independent_bank -p test_full_local_shards.py -v
          python3 independent_bank/full_local_shards.py "$RUNNER_TEMP/local-shards" --target-bytes 262144
          python3 independent_bank/full_local_shards.py "$RUNNER_TEMP/local-shards" --target-bytes 262144 --verify-existing
          cp "$RUNNER_TEMP/local-shards/FullLocalCommon.lean" "$RUNNER_TEMP/local-shards/FullLocal0000.lean" "$p/"
          cd "$p"
      - name: Compare fresh FullLocalCommon processes (diagnostic only)
        shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/pack-project"
          cd "$p"
          export LEAN_PATH="$(lake env printenv LEAN_PATH):$p"
          export LEAN_STACK_SIZE_KB=262144
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/audit/full-reflective" -p test_cap_probe.py -v
          lean --version | tee "$RUNNER_TEMP/cap-lean-version.txt"
          inputs=(--input "$p" --input "$(lean --print-prefix)")
          IFS=: read -r -a lean_paths <<< "$LEAN_PATH"
          for dir in "${lean_paths[@]}"; do
            test -z "$dir" || inputs+=(--allow-missing-input "$dir")
          done
          python3 "$GITHUB_WORKSPACE/audit/full-reflective/cap_probe.py" \
            --output "$RUNNER_TEMP/cap-comparison" --timeout 900 "${inputs[@]}" -- \
            bash -c 'rm -f "$RUNNER_TEMP/cap-comparison-output.olean"; exec lean -o "$RUNNER_TEMP/cap-comparison-output.olean" FullLocalCommon.lean'
      - name: Upload independent diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-resource-comparison
          path: |
            ${{ runner.temp }}/cap-comparison/
            ${{ runner.temp }}/cap-lean-version.txt
          if-no-files-found: warn
