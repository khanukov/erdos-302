name: Case rule soundness
on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - '.github/workflows/case-rules.yml'
      - 'lean/CaseRules.lean'
      - 'lean/CaseRulesTest.lean'
      - 'audit/mathlib-bridge-ci/project/**'
      - 'audit/mathlib-bridge-ci/check_axioms.py'
      - 'audit/mathlib-bridge-ci/test_check_axioms.py'
permissions:
  contents: read
jobs:
  case-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test axiom-report gate
        run: |
          python3 -B audit/mathlib-bridge-ci/test_check_axioms.py
          python3 -B -O audit/mathlib-bridge-ci/test_check_axioms.py
      - name: Install bridge-pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.0-rc1/lean-4.33.0-rc1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          printf '%s  %s\n' 25e7b3e18ec75a4e2529fc23194be8e3cc3183df99b553f870d8a111c7488210 "$RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Prepare identical pinned bridge Lake project
        shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/case-project"
          mkdir -p "$p/.lake/packages/mathlib"
          cp audit/mathlib-bridge-ci/project/* "$p/"
          cp lean/{CaseRules,CaseRulesTest}.lean "$p/"
          git -C "$p/.lake/packages/mathlib" init
          git -C "$p/.lake/packages/mathlib" remote add origin https://github.com/teorth/mathlib4.git
          git -C "$p/.lake/packages/mathlib" fetch --no-tags --depth=1 origin da1f94df976c7cd38117281c57d6ee3046c8d104
          git -C "$p/.lake/packages/mathlib" checkout --detach FETCH_HEAD
          test "$(git -C "$p/.lake/packages/mathlib" rev-parse HEAD)" = da1f94df976c7cd38117281c57d6ee3046c8d104
          cd "$p"
          lake exe cache get Mathlib.Data.Finset.Card Mathlib.Tactic
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/CaseRules.olean CaseRules.lean 2>&1 | tee "$RUNNER_TEMP/case-source.log"
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/case-source.log" BankCase.residual_sound BankCase.force_sound BankCase.budget_reject BankCase.split_sound
          lake env lean CaseRulesTest.lean 2>&1 | tee "$RUNNER_TEMP/case-test.log"
          python3 "$GITHUB_WORKSPACE/audit/mathlib-bridge-ci/check_axioms.py" "$RUNNER_TEMP/case-test.log" BankCase.row_reject BankCase.remaining_le_selected
