name: Node 1209 standalone literal rounding diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  literal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify literal transcription and mutation tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B independent_bank/node1209_root_literal.py --check
          python3 -B -m unittest discover -s independent_bank -p test_node1209_root_literal.py
          python3 -B -O -m unittest discover -s independent_bank -p test_node1209_root_literal.py
      - name: Install digest-pinned Lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.0-rc1/lean-4.33.0-rc1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          printf '%s  %s\n' 25e7b3e18ec75a4e2529fc23194be8e3cc3183df99b553f870d8a111c7488210 "$RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Kernel check and exact axiom gate
        run: |
          set -euo pipefail
          f=audit/node1209-root-literal/RootRoundingLiteral.lean
          if grep -nE '\b(sorry|admit|native_decide)\b' "$f"; then exit 1; fi
          lean "$f" | tee "$RUNNER_TEMP/literal.log"
          python3 audit/mathlib-bridge-ci/check_axioms.py "$RUNNER_TEMP/literal.log" RootRoundingLiteral.length_checked RootRoundingLiteral.objective_checked RootRoundingLiteral.rounding_checked
