name: First actual sparse boundary aggregate
on:
  workflow_dispatch:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: khanukov/erdos302
          ref: a60f43511ce0741ef6e80bdb9b620c5bf854f81c
          path: lower-source
          persist-credentials: false
      - name: Validate source, generated bytes and negative tests
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s audit/actual-sparse64 -p 'test_*.py'
          python3 -B -O -m unittest discover -s audit/actual-sparse64 -p 'test_*.py'
          python3 -B -m unittest discover -s audit/extension-ci -p test_sparse_mathlib_ci.py
          python3 -B audit/mathlib-bridge-ci/test_check_axioms.py
          python3 -B audit/actual-sparse64/generate.py --check
          python3 -B audit/actual-sparse64/closure.py "$RUNNER_TEMP/source"
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.0-rc1/lean-4.33.0-rc1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          printf '%s  %s\n' 25e7b3e18ec75a4e2529fc23194be8e3cc3183df99b553f870d8a111c7488210 "$RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Build complete closure, all shards, aggregate and exact type contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C lower-source rev-parse HEAD)" = a60f43511ce0741ef6e80bdb9b620c5bf854f81c
          printf '%s  %s\n' bf79ae9596f6872d3275ee91f8b2dc52b49eb5bdd60b2c8b41782f87dc137f9d lower-source/lower-lean/Erdos302Lower/Defs.lean | sha256sum -c -
          p="$RUNNER_TEMP/project"
          mkdir -p "$p/Erdos302Lower" "$RUNNER_TEMP/logs"
          cp audit/mathlib-bridge-ci/project/* "$p/"
          cp lower-source/lower-lean/Erdos302Lower/Defs.lean "$p/Erdos302Lower/"
          cp -R "$RUNNER_TEMP/source/." "$p/"
          cp audit/actual-sparse64/Contract.lean "$p/Contract.lean"
          cd "$p"
          mkdir -p .lake/packages/mathlib
          git -C .lake/packages/mathlib init
          git -C .lake/packages/mathlib remote add origin https://github.com/teorth/mathlib4.git
          git -C .lake/packages/mathlib fetch --no-tags --depth=1 origin da1f94df976c7cd38117281c57d6ee3046c8d104
          git -C .lake/packages/mathlib checkout --detach FETCH_HEAD
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = da1f94df976c7cd38117281c57d6ee3046c8d104
          lake exe cache get || echo 'Mathlib cache unavailable; build may time out'
          lake build Erdos302Lower.Defs
          export LEAN_PATH="$(lake env printenv LEAN_PATH):$p"
          export LEAN_NUM_THREADS=1 LEAN_STACK_SIZE_KB=262144
          # Controlled rerun: cap each process at 24 GiB of virtual address space,
          # not 24 GiB of physical memory. The original thread failure's cause is unknown.
          ulimit -v 25165824
          snapshot_resources() {
            echo 'Resource limits (KiB unless noted):'
            ulimit -a
            echo 'Process limits:'
            cat /proc/self/limits
            echo 'Memory:'
            cat /proc/meminfo
            for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.events /sys/fs/cgroup/pids.max /sys/fs/cgroup/pids.current; do
              if [ -r "$f" ]; then printf '\n%s\n' "$f"; cat "$f"; fi
            done
          }
          snapshot_resources > "$RUNNER_TEMP/logs/resources-before.txt" || true
          trap 'snapshot_resources > "$RUNNER_TEMP/logs/resources-after.txt" || true' EXIT
          python3 "$GITHUB_WORKSPACE/audit/actual-sparse64/build.py" "$p" "$RUNNER_TEMP/logs"
      - name: Retain module logs and resource measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sparse64-aggregate-logs
          path: ${{ runner.temp }}/logs
          if-no-files-found: warn
